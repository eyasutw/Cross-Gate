<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飾品道具資料庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12162a;
    --panel: #1b2140;
    --panel-2: #232b52;
    --line: #333e6e;
    --gold: #c9a24b;
    --gold-soft: #8e7639;
    --text: #e9e6d8;
    --text-dim: #9aa0c4;
    --earth: #a67c3d;
    --water: #4a9fd8;
    --fire: #d1495b;
    --wind: #5fb98a;
    --danger: #d1495b;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(201,162,75,0.08), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(74,159,216,0.07), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: "Noto Sans TC", sans-serif;
    min-height:100vh;
  }

  .wrap{ width: 100%; margin: 0; padding: 40px 24px 80px; }

  /* ---- Hero ---- */
  header.hero{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap: 24px;
    padding-bottom: 28px;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .hero-eyebrow{
    font-family:"JetBrains Mono", monospace;
    letter-spacing: 0.18em;
    font-size: 11px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  h1.title{
    font-family:"Cinzel", serif;
    font-weight: 700;
    font-size: clamp(28px, 4vw, 44px);
    margin: 0;
    letter-spacing: 0.02em;
    background: linear-gradient(180deg, #fff5da 0%, var(--gold) 65%, var(--gold-soft) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle{
    color: var(--text-dim);
    margin-top: 8px;
    font-size: 14px;
    max-width: 520px;
    line-height: 1.6;
  }
  .stat-pill{
    font-family:"JetBrains Mono", monospace;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 13px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .stat-pill b{ color: var(--gold); font-size: 16px; }

  /* ---- Controls ---- */
  .controls{
    display:flex;
    gap:14px;
    flex-wrap: wrap;
    align-items:center;
    margin-bottom: 18px;
  }
  .search-box{
    flex: 1 1 280px;
    position: relative;
  }
  .search-box input{
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 13px 16px 13px 42px;
    color: var(--text);
    font-size: 14px;
    font-family: "Noto Sans TC", sans-serif;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .search-box input:focus{
    border-color: var(--gold-soft);
    box-shadow: 0 0 0 3px rgba(201,162,75,0.15);
  }
  .search-box svg{
    position:absolute; left:14px; top:50%; transform: translateY(-50%);
    width:16px; height:16px; stroke: var(--text-dim);
  }
  .filter-tabs{
    display:flex; gap: 8px; flex-wrap: wrap;
  }
  .filter-tabs button{
    font-family: "Noto Sans TC", sans-serif;
    font-size: 13px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 10px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .filter-tabs button:hover{ border-color: var(--gold-soft); color: var(--text); }
  .filter-tabs button.active{
    background: linear-gradient(180deg, #d8b869, var(--gold-soft));
    border-color: var(--gold-soft);
    color: #1a1508;
    font-weight: 700;
  }

  /* ---- Table ---- */
  .table-scroll{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: auto;
    max-height: 68vh;
  }
  table{
    border-collapse: collapse;
    width: 100%;
    min-width: 1600px;
    font-family: "JetBrains Mono", monospace;
    font-size: 12.5px;
  }
  thead th{
    position: sticky; top:0; z-index:2;
    background: var(--panel-2);
    color: var(--gold);
    text-align: left;
    padding: 12px 12px;
    font-weight: 600;
    font-family: "Noto Sans TC", sans-serif;
    font-size: 12.5px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
  }
  thead th:first-child{ position: sticky; left:0; z-index:3; }
  thead th .arrow{ opacity:0.35; font-size: 10px; margin-left:4px; }
  thead th.sorted .arrow{ opacity:1; color:#fff; }
  thead th:hover{ background:#2a3260; }

  tbody td{
    padding: 10px 12px;
    border-bottom: 1px solid rgba(51,62,110,0.5);
    white-space: nowrap;
    color: var(--text);
  }
  tbody td:first-child{
    position: sticky; left:0;
    background: var(--panel);
    font-family: "Noto Sans TC", sans-serif;
    font-weight: 700;
    color: #fff5da;
  }
  tbody tr:hover td{ background: #232c58; }
  tbody tr:hover td:first-child{ background:#2a336a; }
  tbody tr:nth-child(even) td{ background: rgba(255,255,255,0.02); }
  tbody tr:nth-child(even):hover td{ background:#232c58; }

  .empty-state{
    text-align:center; padding: 60px 20px; color: var(--text-dim);
    font-family: "Noto Sans TC", sans-serif;
  }

  .footnote{
    margin-top: 18px;
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.7;
  }
  .footnote code{
    background: var(--panel);
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid var(--line);
    color: var(--gold);
  }

  ::-webkit-scrollbar{ height:10px; width:10px; }
  ::-webkit-scrollbar-track{ background: var(--panel); }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover{ background: var(--gold-soft); }

  /* ---- 進階搜尋按鈕 / 面板 ---- */
  .adv-search-btn{
    font-family: "Noto Sans TC", sans-serif;
    font-size: 13px;
    background: var(--panel);
    border: 1px solid var(--gold-soft);
    color: var(--gold);
    padding: 10px 16px;
    border-radius: var(--radius);
    cursor: pointer;
    white-space: nowrap;
  }
  .adv-search-btn:hover{ background:#2a3260; }
  .adv-search-btn.active{
    background: linear-gradient(180deg, #d8b869, var(--gold-soft));
    border-color: var(--gold-soft);
    color: #1a1508;
    font-weight: 700;
  }
  .controls-label{ color: var(--text-dim); font-size: 13px; white-space: nowrap; }
  .adv-panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px 14px;
  }
  .adv-panel .adv-field{ display:flex; flex-direction:column; gap:4px; }
  .adv-panel label{ font-size:12px; color: var(--text-dim); }
  .adv-panel input{
    background: var(--panel-2); border:1px solid var(--line); border-radius:6px;
    padding: 6px 8px; color: var(--text); font-size:13px; font-family:"JetBrains Mono", monospace;
    outline:none;
  }
  .adv-panel input:focus{ border-color: var(--gold-soft); }
  .adv-panel-actions{
    grid-column: 1 / -1; display:flex; gap:10px; margin-top:4px;
  }
  .adv-panel-actions button{
    font-family: "Noto Sans TC", sans-serif; font-size:13px; padding:8px 16px;
    border-radius: 999px; border:1px solid var(--gold-soft); cursor:pointer;
  }
  #btnAdvApply{ background: linear-gradient(180deg, #d8b869, var(--gold-soft)); color:#1a1508; font-weight:700; }
  #btnAdvClear{ background: var(--panel-2); color: var(--text-dim); }
  .adv-summary{
    font-size:12px; color: var(--gold); margin: -6px 0 14px;
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  }
  .adv-summary button{
    background:none; border:1px solid var(--line); color:var(--text-dim);
    border-radius:999px; padding:2px 10px; cursor:pointer; font-size:11px;
  }

  /* ---- 資料同步 ---- */
  .sync-row{ background: rgba(255,255,255,0.02); border:1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; }
  .sync-btn{
    font-family:"Noto Sans TC", sans-serif; font-size:12.5px;
    background: var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:8px 14px; border-radius:999px; cursor:pointer;
  }
  .sync-btn:hover{ border-color: var(--gold-soft); }
  .sync-btn:disabled{ opacity: 0.45; cursor: not-allowed; }
  .sync-btn:disabled:hover{ border-color: var(--line); }
  .sync-file{ font-size:12px; color: var(--text-dim); max-width:180px; }
  .controls-hint{ font-size:12px; color: var(--text-dim); }

  /* ---- 道具名稱連結 / 圖片放大 ---- */
  .item-name-link{
    color:#7fc4ff; text-decoration:underline; cursor:pointer; background:none; border:none;
    font: inherit; padding:0; text-align:left;
  }
  .item-name-link:hover{ color:#a9dcff; }
  .img-modal-overlay{
    position: fixed; inset:0; background: rgba(10,12,24,0.72);
    display:flex; align-items:center; justify-content:center; z-index: 50;
  }
  .img-modal-box{
    background: var(--panel); border:1px solid var(--line); border-radius: var(--radius);
    padding: 20px; max-width: 90vw; max-height: 85vh; overflow:auto; position:relative;
    min-width: 260px; text-align:center;
  }
  .img-modal-close{
    position:absolute; top:10px; right:10px; background:#8a2a2a; color:#fff; border:none;
    border-radius:6px; padding:4px 10px; cursor:pointer;
  }
  .img-modal-title{ font-weight:700; color: var(--gold); margin-bottom:12px; font-size:16px; }
  .img-modal-body img{ max-width: 70vw; max-height: 65vh; border-radius:8px; }
  .img-modal-body{ color: var(--text-dim); font-size:13px; padding: 20px 10px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div>
      <div class="hero-eyebrow">永恆初心 · 飾品道具資料庫</div>
      <h1 class="title">飾品道具查詢表</h1>
    </div>
    <div class="stat-pill">目前收錄 <b id="countNum">0</b> 件道具</div>
  </header>

  <div class="controls">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="輸入道具關鍵字搜尋（名稱、分類、原始說明都可以搜）">
    </div>
    <button id="btnAdvancedSearch" class="adv-search-btn">🔎 更多搜尋</button>
    <div class="filter-tabs" id="filterTabs"></div>
  </div>
  <div class="controls" id="slotTabsRow">
    <span class="controls-label">部位：</span>
    <div class="filter-tabs" id="slotTabs"></div>
  </div>
  <div id="advPanel" class="adv-panel" style="display:none"></div>
  <div id="advSummary" class="adv-summary" style="display:none"></div>

  <div class="controls sync-row">
    <span class="controls-label">資料同步：</span>
    <button id="btnExportItems" class="sync-btn">⬇ 匯出目前資料 (JSON)</button>
    <input type="file" id="itemImportFile" accept="application/json,.json" class="sync-file">
    <button id="btnImportItems" class="sync-btn">⬆ 匯入並套用</button>
    <button id="btnPushSupabaseItems" class="sync-btn">☁ 上傳到共用資料庫</button>
    <button id="btnPullSupabaseItems" class="sync-btn">⟲ 重新讀取共用資料庫</button>
    <span class="controls-hint" id="itemSyncHint"></span>
  </div>

  <div class="table-scroll">
    <table id="dataTable">
      <thead>
        <tr id="headerRow"></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

</div>

<div id="imgModalOverlay" class="img-modal-overlay" style="display:none">
  <div class="img-modal-box">
    <button id="imgModalClose" class="img-modal-close">✕</button>
    <div class="img-modal-title" id="imgModalTitle"></div>
    <div class="img-modal-body" id="imgModalBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  // ── Supabase：大家共用的道具資料庫（跟寵物頁共用同一個 Supabase 專案，
  // 但存在不同的資料表 "items" 裡；設定方式見 README.md「Supabase 設定步驟」）──
  let supabaseClient = null;
  if (typeof SUPABASE_URL !== "undefined" && SUPABASE_URL && SUPABASE_ANON_KEY && typeof window.supabase !== "undefined") {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  function itemToSupabaseRecord(it) {
    return {
      category: it.category, name: it.name, level: it.level, durability: it.durability,
      hp: it.hp || 0, mp: it.mp || 0, atk: it.atk || 0, def: it.def || 0, agi: it.agi || 0,
      crit: it.crit || 0, counter: it.counter || 0, hit: it.hit || 0, dodge: it.dodge || 0,
      regen: it.regen || 0, spirit: it.spirit || 0, matk: it.matk || 0, mres: it.mres || 0,
      poison: it.poison || 0, petrify: it.petrify || 0, confuse: it.confuse || 0, forget: it.forget || 0,
      drunk: it.drunk || 0, charm: it.charm || 0, curse: it.curse || 0, sleep: it.sleep || 0,
      earth: it.earth || 0, water: it.water || 0,
      fire: it.fire || 0, wind: it.wind || 0, skill_reduction: it.skillReduction || 0,
      icon: it.icon || null, location: it.location || null, effect: it.effect,
    };
  }

  function supabaseRecordToItem(r) {
    return {
      category: r.category, name: r.name, level: r.level, durability: r.durability,
      hp: r.hp, mp: r.mp, atk: r.atk, def: r.def, agi: r.agi, crit: r.crit, counter: r.counter,
      hit: r.hit, dodge: r.dodge, regen: r.regen, spirit: r.spirit, matk: r.matk, mres: r.mres,
      poison: r.poison, petrify: r.petrify, confuse: r.confuse, forget: r.forget, drunk: r.drunk,
      charm: r.charm, curse: r.curse, sleep: r.sleep, earth: r.earth, water: r.water, fire: r.fire, wind: r.wind,
      skillReduction: r.skill_reduction, icon: r.icon, location: r.location, effect: r.effect,
    };
  }

  async function loadItemsFromSupabase() {
    if (!supabaseClient) return null;
    const all = [];
    const pageSize = 1000;
    for (let from = 0; ; from += pageSize) {
      const { data, error } = await supabaseClient.from("items").select("*").range(from, from + pageSize - 1);
      if (error) throw error;
      if (!data || !data.length) break;
      all.push(...data.map(supabaseRecordToItem));
      if (data.length < pageSize) break;
    }
    return all.length ? all : null;
  }

  async function pushItemsToSupabase(itemList) {
    if (!supabaseClient) return { skipped: true };
    // 道具名稱不是唯一值（例如「大地鼠帽」在資料裡出現兩次、數值不同），沒辦法用 upsert 比對，
    // 所以「上傳」採用「整批覆蓋」：先清空雲端資料表，再把目前畫面上的資料整批寫入。
    const { error: delError } = await supabaseClient.from("items").delete().gte("id", 0);
    if (delError) throw delError;
    const rows = itemList.map(itemToSupabaseRecord);
    const chunkSize = 500;
    for (let i = 0; i < rows.length; i += chunkSize) {
      const chunk = rows.slice(i, i + chunkSize);
      const { error } = await supabaseClient.from("items").insert(chunk);
      if (error) throw error;
    }
    return { skipped: false, count: rows.length };
  }
</script>

  ];

  // ---- 小工具 ----
  function escapeHtml(str){
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  // ---- 數值區間支援 ----
  // 有些道具的數值是浮動區間（例如攻擊 -100~100），欄位裡可以直接填數字（固定值），
  // 也可以填 "最小值~最大值" 的文字（例如 "-100~100"、"100~170"）。
  // 這裡統一用 "~" 當區間分隔符號，不用 "-"，是因為數值本身可能是負的，用 "-" 會分不清楚。
  function parseStatRange(val){
    if (val === undefined || val === null || val === "") return { min: 0, max: 0 };
    if (typeof val === "number") return { min: val, max: val };
    const str = String(val).trim();
    const m = str.match(/^(-?\d+(?:\.\d+)?)\s*~\s*(-?\d+(?:\.\d+)?)$/);
    if (m) {
      const a = parseFloat(m[1]), b = parseFloat(m[2]);
      return { min: Math.min(a, b), max: Math.max(a, b) };
    }
    const n = parseFloat(str);
    return isNaN(n) ? { min: 0, max: 0 } : { min: n, max: n };
  }
  function statMax(val){ return parseStatRange(val).max; }
  function statMin(val){ return parseStatRange(val).min; }

  // 依名稱粗略判斷「部位」：項鍊/戒指/手鍊/護符/徽章/吊墜 等歸類為護身符，其餘（帽子、頭飾、頭套、耳朵…）視為頭飾。
  function classifySlot(name){
    if (/扭蛋娃娃/.test(name)) return "護身符"; // 遊戲內顯示「種類 護身符」，扭蛋娃娃系列一律走護身符欄位
    if (/戒指|戒|項鍊|手鍊|手環|護符|徽章|吊墜|墜飾|符咒|護身符/.test(name)) return "護身符";
    return "頭飾";
  }

  function attributeText(item){
    const parts = [];
    if (item.earth) parts.push("地+" + item.earth);
    if (item.water) parts.push("水+" + item.water);
    if (item.fire)  parts.push("火+" + item.fire);
    if (item.wind)  parts.push("風+" + item.wind);
    return parts.join("、");
  }

  // 補上每筆道具的衍生欄位（部位、屬性文字），匯入新資料時也會重新計算一次。
  function enrichItems(list){
    return list.map(item => Object.assign({}, item, {
      slot: item.slot || classifySlot(item.name || ""),
      attribute: attributeText(item),
    }));
  }

  // ---- 本機快取：匯入的資料存在瀏覽器裡，重新整理網頁也不會不見 ----
  const ITEMS_CACHE_KEY = "cg_items_cache_v1";
  function saveItemsToCache(list){
    try { localStorage.setItem(ITEMS_CACHE_KEY, JSON.stringify(list)); } catch (e) { console.error("寫入道具本機快取失敗：", e); }
  }
  function loadItemsFromCache(){
    try {
      const raw = localStorage.getItem(ITEMS_CACHE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) && parsed.length ? parsed : null;
    } catch (e) { console.error("讀取道具本機快取失敗：", e); return null; }
  }

  const cachedItems = loadItemsFromCache();
  let ITEMS = enrichItems(cachedItems || BUILTIN_ITEMS);
  const usedCache = !!cachedItems;

  // 可用來做「更多搜尋」數字門檻篩選的欄位（純數字欄位才適用）
  const ADV_KEYS = COLUMNS.filter(c => c.type === "num").map(c => c.key);

  // ---- 狀態 ----
  let sortKey = "name";
  let sortDir = "asc";
  let activeCategory = "全部";
  let activeSlot = "全部";
  let searchTerm = "";
  let advFilters = {};   // { hp: 100, mp: 50, ... } 表示「該欄位 >= 數值」
  let currentRows = [];  // 目前畫面上顯示的資料（篩選/排序後），給名稱連結點擊時對照用

  const headerRow = document.getElementById("headerRow");
  const tableBody = document.getElementById("tableBody");
  const filterTabs = document.getElementById("filterTabs");
  const slotTabs = document.getElementById("slotTabs");
  const searchInput = document.getElementById("searchInput");
  const countNum = document.getElementById("countNum");
  const btnAdvancedSearch = document.getElementById("btnAdvancedSearch");
  const advPanel = document.getElementById("advPanel");
  const advSummary = document.getElementById("advSummary");
  const btnExportItems = document.getElementById("btnExportItems");
  const itemImportFile = document.getElementById("itemImportFile");
  const btnImportItems = document.getElementById("btnImportItems");
  const itemSyncHint = document.getElementById("itemSyncHint");
  const imgModalOverlay = document.getElementById("imgModalOverlay");
  const imgModalTitle = document.getElementById("imgModalTitle");
  const imgModalBody = document.getElementById("imgModalBody");
  const imgModalClose = document.getElementById("imgModalClose");

  function renderHeader(){
    headerRow.innerHTML = "";
    COLUMNS.forEach(col => {
      const th = document.createElement("th");
      th.dataset.key = col.key;
      const arrow = sortKey === col.key ? (sortDir === "asc" ? "▲" : "▼") : "◆";
      th.innerHTML = `${col.label}<span class="arrow">${arrow}</span>`;
      if (sortKey === col.key) th.classList.add("sorted");
      th.addEventListener("click", () => {
        if (sortKey === col.key) {
          sortDir = sortDir === "asc" ? "desc" : "asc";
        } else {
          sortKey = col.key;
          sortDir = "asc";
        }
        renderAll();
      });
      headerRow.appendChild(th);
    });
  }

  function renderTabs(){
    const cats = ["全部", ...Array.from(new Set(ITEMS.map(i => i.category)))];
    filterTabs.innerHTML = "";
    cats.forEach(cat => {
      const btn = document.createElement("button");
      btn.textContent = cat;
      if (cat === activeCategory) btn.classList.add("active");
      btn.addEventListener("click", () => {
        activeCategory = cat;
        renderAll();
      });
      filterTabs.appendChild(btn);
    });
  }

  function renderSlotTabs(){
    const slots = ["全部", "頭飾", "護身符"];
    slotTabs.innerHTML = "";
    slots.forEach(slot => {
      const btn = document.createElement("button");
      btn.textContent = slot;
      if (slot === activeSlot) btn.classList.add("active");
      btn.addEventListener("click", () => {
        activeSlot = slot;
        renderAll();
      });
      slotTabs.appendChild(btn);
    });
  }

  // ---- 更多搜尋（數字門檻，可複數條件同時套用） ----
  const advInputs = {};
  function buildAdvPanel(){
    advPanel.innerHTML = "";
    ADV_KEYS.forEach(key => {
      const col = COLUMNS.find(c => c.key === key);
      const field = document.createElement("div");
      field.className = "adv-field";
      const label = document.createElement("label");
      label.textContent = col.label + " ≥";
      const input = document.createElement("input");
      input.type = "number";
      input.placeholder = "不限";
      input.dataset.key = key;
      advInputs[key] = input;
      field.appendChild(label);
      field.appendChild(input);
      advPanel.appendChild(field);
    });
    const actions = document.createElement("div");
    actions.className = "adv-panel-actions";
    const applyBtn = document.createElement("button");
    applyBtn.id = "btnAdvApply";
    applyBtn.textContent = "套用搜尋";
    applyBtn.addEventListener("click", applyAdvFilters);
    const clearBtn = document.createElement("button");
    clearBtn.id = "btnAdvClear";
    clearBtn.textContent = "清除全部";
    clearBtn.addEventListener("click", clearAdvFilters);
    actions.appendChild(applyBtn);
    actions.appendChild(clearBtn);
    advPanel.appendChild(actions);
  }

  function applyAdvFilters(){
    advFilters = {};
    ADV_KEYS.forEach(key => {
      const raw = advInputs[key].value.trim();
      if (raw !== "" && !isNaN(Number(raw))) {
        advFilters[key] = Number(raw);
      }
    });
    renderSummary();
    renderBody();
  }

  function clearAdvFilters(){
    advFilters = {};
    ADV_KEYS.forEach(key => { if (advInputs[key]) advInputs[key].value = ""; });
    renderSummary();
    renderBody();
  }

  function renderSummary(){
    const keys = Object.keys(advFilters);
    if (!keys.length) {
      advSummary.style.display = "none";
      advSummary.innerHTML = "";
      return;
    }
    advSummary.style.display = "flex";
    advSummary.innerHTML = "目前套用：";
    keys.forEach(key => {
      const col = COLUMNS.find(c => c.key === key);
      const chip = document.createElement("button");
      chip.textContent = `${col.label} ≥ ${advFilters[key]} ✕`;
      chip.addEventListener("click", () => {
        delete advFilters[key];
        if (advInputs[key]) advInputs[key].value = "";
        renderSummary();
        renderBody();
      });
      advSummary.appendChild(chip);
    });
    const clearAllBtn = document.createElement("button");
    clearAllBtn.textContent = "清除全部 ✕";
    clearAllBtn.addEventListener("click", clearAdvFilters);
    advSummary.appendChild(clearAllBtn);
  }

  btnAdvancedSearch.addEventListener("click", () => {
    const showing = advPanel.style.display !== "none";
    if (showing) {
      advPanel.style.display = "none";
      btnAdvancedSearch.classList.remove("active");
    } else {
      if (!advPanel.dataset.built) {
        buildAdvPanel();
        advPanel.dataset.built = "1";
      }
      advPanel.style.display = "grid";
      btnAdvancedSearch.classList.add("active");
    }
  });

  // ---- 名稱連結 → 放大圖片視窗 ----
  function openImageModal(item){
    imgModalTitle.textContent = item.name;
    if (item.icon) {
      imgModalBody.innerHTML = `<img src="${escapeHtml(item.icon)}" alt="${escapeHtml(item.name)}">`;
    } else {
      imgModalBody.innerHTML = `<div>目前這個道具還沒有收錄圖片。<br>之後補上圖片來源時，只要在資料裡加上 <code style="background:#232b52;padding:1px 6px;border-radius:4px">icon</code>（圖片網址）欄位，這裡就會自動顯示圖示。</div>`;
    }
    imgModalOverlay.style.display = "flex";
  }
  imgModalClose.addEventListener("click", () => { imgModalOverlay.style.display = "none"; });
  imgModalOverlay.addEventListener("click", (e) => {
    if (e.target === imgModalOverlay) imgModalOverlay.style.display = "none";
  });
  tableBody.addEventListener("click", (e) => {
    const btn = e.target.closest(".item-name-link");
    if (!btn) return;
    const idx = Number(btn.dataset.idx);
    const item = currentRows[idx];
    if (item) openImageModal(item);
  });

  function cellHTML(col, item, idx){
    if (col.key === "name") {
      return `<button type="button" class="item-name-link" data-idx="${idx}">${escapeHtml(item.name)}</button>`;
    }
    const val = item[col.key];
    if (col.type === "num") {
      if (val === undefined || val === null || val === "" || val === 0 || val === "0") {
        return `<span style="color:#565f92">—</span>`;
      }
      return escapeHtml(String(val));
    }
    if (col.type === "text") {
      return val ? escapeHtml(val) : `<span style="color:#565f92">—</span>`;
    }
    return val;
  }

  function renderBody(){
    let rows = ITEMS.filter(item => {
      const matchCat = activeCategory === "全部" || item.category === activeCategory;
      const matchSlot = activeSlot === "全部" || item.slot === activeSlot;
      const haystack = (item.name + " " + item.category + " " + item.effect + " " + (item.location||"")).toLowerCase();
      const matchSearch = haystack.includes(searchTerm.toLowerCase());
      const matchAdv = Object.keys(advFilters).every(key => statMax(item[key]) >= advFilters[key]);
      return matchCat && matchSlot && matchSearch && matchAdv;
    });

    rows.sort((a, b) => {
      const col = COLUMNS.find(c => c.key === sortKey);
      if (col && col.type === "num") {
        const av = statMax(a[sortKey]), bv = statMax(b[sortKey]);
        return sortDir === "asc" ? av - bv : bv - av;
      }
      let av = a[sortKey], bv = b[sortKey];
      if (typeof av === "string" || typeof bv === "string") {
        av = av == null ? "" : String(av);
        bv = bv == null ? "" : String(bv);
        return sortDir === "asc" ? av.localeCompare(bv, "zh-Hant") : bv.localeCompare(av, "zh-Hant");
      }
      return sortDir === "asc" ? av - bv : bv - av;
    });

    currentRows = rows;
    tableBody.innerHTML = "";
    if (rows.length === 0) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td colspan="${COLUMNS.length}" class="empty-state">找不到符合的道具，換個關鍵字或調整「更多搜尋」條件試試看</td>`;
      tableBody.appendChild(tr);
    } else {
      rows.forEach((item, idx) => {
        const tr = document.createElement("tr");
        tr.innerHTML = COLUMNS.map(col => `<td>${cellHTML(col, item, idx)}</td>`).join("");
        tableBody.appendChild(tr);
      });
    }
    countNum.textContent = rows.length;
  }

  function renderAll(){
    renderHeader();
    renderTabs();
    renderSlotTabs();
    renderBody();
  }

  searchInput.addEventListener("input", (e) => {
    searchTerm = e.target.value;
    renderBody();
  });

  // ---- 資料同步：匯出 / 匯入（存在瀏覽器本機，重新整理網頁不會不見） ----
  function downloadJSON(filename, obj){
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  btnExportItems.addEventListener("click", () => {
    downloadJSON(`cross-gate-items-${new Date().toISOString().slice(0, 10)}.json`, ITEMS);
    itemSyncHint.textContent = `已匯出目前 ${ITEMS.length} 筆道具資料，可以把這個 JSON 檔案分享給別人匯入。`;
  });

  btnImportItems.addEventListener("click", () => {
    const file = itemImportFile.files && itemImportFile.files[0];
    if (!file) { itemSyncHint.textContent = "請先選擇要匯入的 JSON 檔案。"; return; }
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try {
        parsed = JSON.parse(reader.result);
      } catch (err) {
        itemSyncHint.textContent = "匯入失敗：檔案不是合法的 JSON 格式（" + err.message + "）。";
        return;
      }
      if (!Array.isArray(parsed) || !parsed.length || typeof parsed[0] !== "object") {
        itemSyncHint.textContent = "匯入失敗：內容格式不符合預期（需要是道具資料陣列，跟「匯出目前資料」產生的格式一樣）。";
        return;
      }
      ITEMS = enrichItems(parsed);
      saveItemsToCache(ITEMS);
      activeCategory = "全部"; activeSlot = "全部"; searchTerm = ""; advFilters = {};
      searchInput.value = "";
      advPanel.dataset.built = "";
      advPanel.style.display = "none";
      btnAdvancedSearch.classList.remove("active");
      renderAll();
      itemImportFile.value = "";
      itemSyncHint.textContent = `已匯入 ${ITEMS.length} 筆道具資料並套用到目前畫面（已存到本機快取）。`;
    };
    reader.onerror = () => { itemSyncHint.textContent = "讀取檔案失敗，請重新選擇檔案。"; };
    reader.readAsText(file, "utf-8");
  });

  const btnPushSupabaseItems = document.getElementById("btnPushSupabaseItems");
  const btnPullSupabaseItems = document.getElementById("btnPullSupabaseItems");

  function updateItemSyncHint(){
    if (supabaseClient) {
      itemSyncHint.textContent = "已設定共用資料庫（Supabase）：按「上傳到共用資料庫」會把目前畫面上的資料整批覆蓋雲端資料，其他人打開網站也會看到；按「重新讀取共用資料庫」可以拉回雲端目前的內容。";
      btnPushSupabaseItems.disabled = false;
      btnPullSupabaseItems.disabled = false;
    } else {
      itemSyncHint.textContent = usedCache
        ? `已讀取上次匯入的本機資料，共 ${ITEMS.length} 筆（只存在你目前這個瀏覽器裡）。`
        : "資料異動只會存在你目前這個瀏覽器（本機快取）。要分享給別人的話，把「匯出目前資料」的 JSON 檔傳給對方，請對方用「匯入並套用」載入；或依 README.md「Supabase 設定步驟」設定共用資料庫。";
      btnPushSupabaseItems.disabled = true;
      btnPullSupabaseItems.disabled = true;
    }
  }
  updateItemSyncHint();

  btnPushSupabaseItems.addEventListener("click", async () => {
    if (!supabaseClient) {
      itemSyncHint.textContent = "尚未設定共用資料庫（Supabase），請先依照 README.md「Supabase 設定步驟」設定 supabase-config.js。";
      return;
    }
    if (!confirm(`即將把目前畫面上的 ${ITEMS.length} 筆道具資料上傳到共用資料庫，覆蓋雲端現有的資料，其他人重新打開網站也會看到這份資料。確定要上傳嗎？`)) return;
    itemSyncHint.textContent = "上傳中…";
    try {
      const r = await pushItemsToSupabase(ITEMS);
      itemSyncHint.textContent = `已成功上傳 ${r.count != null ? r.count : ITEMS.length} 筆道具資料到共用資料庫。`;
    } catch (err) {
      itemSyncHint.textContent = "上傳到共用資料庫失敗：" + err.message;
    }
  });

  btnPullSupabaseItems.addEventListener("click", async () => {
    if (!supabaseClient) {
      itemSyncHint.textContent = "尚未設定共用資料庫（Supabase），請先依照 README.md「Supabase 設定步驟」設定 supabase-config.js。";
      return;
    }
    itemSyncHint.textContent = "正在讀取共用資料庫…";
    try {
      const cloudItems = await loadItemsFromSupabase();
      if (cloudItems) {
        ITEMS = enrichItems(cloudItems);
        saveItemsToCache(ITEMS);
        activeCategory = "全部"; activeSlot = "全部"; searchTerm = ""; advFilters = {};
        searchInput.value = "";
        advPanel.dataset.built = ""; advPanel.style.display = "none";
        btnAdvancedSearch.classList.remove("active");
        renderAll();
        itemSyncHint.textContent = `已從共用資料庫讀取最新的 ${ITEMS.length} 筆道具資料。`;
      } else {
        itemSyncHint.textContent = "共用資料庫目前是空的，還沒有人上傳過資料。";
      }
    } catch (err) {
      itemSyncHint.textContent = "讀取共用資料庫失敗：" + err.message;
    }
  });

  // 有設定共用資料庫的話，一打開網頁就先嘗試拉一次雲端最新資料
  if (supabaseClient) {
    loadItemsFromSupabase().then(cloudItems => {
      if (cloudItems) {
        ITEMS = enrichItems(cloudItems);
        saveItemsToCache(ITEMS);
        renderAll();
        itemSyncHint.textContent = `已讀取共用資料庫，共 ${ITEMS.length} 筆道具資料。`;
      }
    }).catch(err => console.error("Supabase 道具讀取失敗：", err));
  }

  renderAll();
</script>
</body>
</html>
