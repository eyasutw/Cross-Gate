<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cross-Gate 工具站</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; }
  .portal { display: flex; height: 100vh; overflow: hidden; }

  .sidebar {
    width: 200px; flex-shrink: 0; background: #14172a; color: #cfd3ea;
    display: flex; flex-direction: column; padding: 16px 0;
  }
  .sidebar .brand {
    padding: 0 18px 18px 18px; font-weight: bold; font-size: 15px;
    color: #e9d9a6; border-bottom: 1px solid #2a2f4d; margin-bottom: 8px;
  }
  .menu-item {
    padding: 12px 18px; cursor: pointer; font-size: 14px; color: #cfd3ea;
    border-left: 3px solid transparent; transition: background 0.15s;
  }
  .menu-item:hover { background: #1d2140; }
  .menu-item.active {
    background: #232852; border-left: 3px solid #e9d9a6; color: #fff; font-weight: bold;
  }

  .content { flex: 1; min-width: 0; height: 100vh; }
  .content iframe { width: 100%; height: 100%; border: none; display: block; }
</style>
</head>
<body>

<div class="portal">
  <div class="sidebar">
    <div class="brand">Cross-Gate 工具站</div>
    <div class="menu-item active" data-page="pets.html">寵物算檔模擬</div>
    <div class="menu-item" data-page="items.html">飾品資料庫</div>
  </div>
  <div class="content">
    <iframe id="contentFrame" src="pets.html"></iframe>
  </div>
</div>

<script>
  document.querySelectorAll(".menu-item").forEach((item) => {
    item.addEventListener("click", () => {
      document.querySelectorAll(".menu-item").forEach((i) => i.classList.remove("active"));
      item.classList.add("active");
      document.getElementById("contentFrame").src = item.dataset.page;
    });
  });
</script>

</body>
</html>
